name: Blog post

# Writes the next post (or several, via the count input) from
# .claude/blog-topics.md. A run that raises no flags commits straight to main
# and goes live; a run with any flag becomes a pull request labelled
# needs-review instead, with a Netlify deploy preview on the branch.
#
# Hard failures in the generator reach neither path — they write nothing and
# fail the run, so the publish step only ever sees a structurally sound post.
#
# Times are UTC. 13:00 UTC is 9am Eastern while daylight saving is in effect and
# 8am once it ends in November; that hour of drift is deliberate — moving it
# would mean two schedules to maintain for no benefit.

on:
  schedule:
    - cron: '0 13 * * 2,5'   # Tuesdays and Fridays, matching the existing cadence
  workflow_dispatch:
    inputs:
      topic:
        description: 'Slug to publish, skipping the queue order (optional)'
        required: false
        type: string
      count:
        description: 'How many posts to write in this run (default 1)'
        required: false
        type: string
        default: '1'
      dry_run:
        description: 'Build the prompt and stop, without calling the model'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: blog-post
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Generate the post
        id: generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOG_MODEL: ${{ vars.BLOG_MODEL }}
          PR_BODY_FILE: ${{ runner.temp }}/pr-body.md
          TOPIC: ${{ inputs.topic }}
          DRY_RUN: ${{ inputs.dry_run }}
          COUNT: ${{ inputs.count }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$TOPIC" ]; then args+=(--topic "$TOPIC"); fi
          if [ -n "$COUNT" ]; then args+=(--count "$COUNT"); fi
          node scripts/generate-post.mjs ${args[@]+"${args[@]}"}

      # A post that raised no flags publishes itself. The hard failures in the
      # generator have already run at this point and write nothing when they
      # trip, so anything reaching here is structurally sound; flags are the
      # cases that want a human eye, and only those become a pull request.
      - name: Publish
        if: steps.generate.outputs.created == 'true' && steps.generate.outputs.flags == '0'
        env:
          TITLE: ${{ steps.generate.outputs.title }}
        run: |
          git config user.name  "scapeshq-blog[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add blog/ sitemap.xml netlify.toml .claude/blog-topics.md
          git commit -m "Add blog post: $TITLE" \
                     -m "Generated from the topic queue, no flags raised." \
                     -m "Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"

          # Someone may have pushed while the model was writing.
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Open the pull request
        if: steps.generate.outputs.created == 'true' && steps.generate.outputs.flags != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLUG: ${{ steps.generate.outputs.slug }}
          TITLE: ${{ steps.generate.outputs.title }}
        run: |
          git config user.name  "scapeshq-blog[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="blog/$SLUG"
          git checkout -b "$BRANCH"
          git add blog/ sitemap.xml netlify.toml .claude/blog-topics.md
          git commit -m "Add blog post: $TITLE" \
                     -m "Generated from the topic queue. Flagged for review." \
                     -m "Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
          git push --force origin "$BRANCH"

          gh label create "blog" --color 3ddbb4 --description "Generated blog posts" 2>/dev/null || true
          gh label create "needs-review" --color d4a017 --description "Automated checks raised flags" 2>/dev/null || true

          gh pr create \
            --title "Blog: $TITLE" \
            --body-file "${{ runner.temp }}/pr-body.md" \
            --label "blog,needs-review" \
            --base main \
            --head "$BRANCH"

      - name: Summary
        if: always()
        # Model-written values go through the environment, never through shell
        # interpolation — a title containing a backtick would otherwise execute.
        env:
          CREATED: ${{ steps.generate.outputs.created }}
          TITLE: ${{ steps.generate.outputs.title }}
          FLAGS: ${{ steps.generate.outputs.flags }}
          REASON: ${{ steps.generate.outputs.reason }}
          BODY_FILE: ${{ runner.temp }}/pr-body.md
        run: |
          if [ "$CREATED" = "true" ]; then
            if [ "$FLAGS" = "0" ]; then
              printf '### Published: %s\n\nNo flags raised, so it went straight to main and is live.\n\n' "$TITLE" >> "$GITHUB_STEP_SUMMARY"
            else
              printf '### Waiting for review: %s\n\n%s flag(s) raised, so it is a pull request rather than a publish.\n\n' "$TITLE" "$FLAGS" >> "$GITHUB_STEP_SUMMARY"
            fi
            cat "$BODY_FILE" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$REASON" = "empty-queue" ]; then
            printf '### Nothing to publish\n\nThe topic queue in `.claude/blog-topics.md` has no unchecked entries.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
