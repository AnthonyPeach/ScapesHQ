[build]
  publish = "."
  # Static site — no build step, no dependencies.
  command = ""

# Assets are NOT fingerprinted — styles.css and nav.js keep the same filename
# across deploys — so they must never be cached immutably. Revalidate on every
# request instead: Netlify answers with a 304 when nothing changed, which is
# cheap, and an edit reaches returning visitors on their next page load.
# If these ever gain content hashes in the filename (styles.a1b2c3.css),
# switch this back to "public, max-age=31536000, immutable".
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# publish = "." means the whole repository is served, so the machinery that
# writes the blog would otherwise be fetchable at /scripts/generate-post.mjs.
# Nothing secret lives there — the API key is a GitHub secret and never touches
# the repo — but it is not part of the site and should not answer 200.
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.github/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true

# Collapse the duplicate .html URLs onto the pretty paths the sitemap and the
# rel="canonical" tags declare. force = true is required: without it a matching
# static file wins over the redirect, which is exactly the situation here.
# 404.html is deliberately absent — Netlify serves it for error responses and
# redirecting it would break that.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/features.html"
  to = "/features"
  status = 301
  force = true

